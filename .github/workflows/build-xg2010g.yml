name: Build PonWrt XG2010G

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-xg2010g-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build Gemtek XG2010G
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        shell: bash
        run: |
          set -e
          echo "========== Disk before =========="
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          echo ""
          echo "========== Disk after =========="
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            zlib1g-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            curl \
            file \
            time \
            ccache \
            llvm \
            lld \
            zstd \
            xz-utils \
            tar \
            patch \
            perl \
            make \
            sed

      - name: Add PassWall feeds
        shell: bash
        run: |
          set -e
          echo "========== Original feeds =========="
          cat feeds.conf.default
          sed -i '/Openwrt-Passwall\/openwrt-passwall-packages/d' feeds.conf.default
          sed -i '/Openwrt-Passwall\/openwrt-passwall.git/d' feeds.conf.default
          sed -i '/Openwrt-Passwall\/openwrt-passwall;/d' feeds.conf.default
          {
            echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main'
            echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main'
            cat feeds.conf.default
          } > feeds.conf.default.new
          mv feeds.conf.default.new feeds.conf.default
          echo ""
          echo "========== Final feeds =========="
          cat feeds.conf.default

      - name: Update feeds
        shell: bash
        run: |
          set -e
          ./scripts/feeds update -a

      - name: Install feeds
        shell: bash
        run: |
          set -e
          ./scripts/feeds install -a

      - name: Add Lucky
        shell: bash
        run: |
          set -e
          rm -rf package/lucky
          git clone \
            --depth 1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky
          echo "========== Lucky package Makefiles =========="
          find package/lucky -maxdepth 2 -name Makefile -print

      - name: Load PonWrt AN7581 config
        shell: bash
        run: |
          set -e
          if [ ! -f "configs/an7581.config" ]; then
            echo "::error::configs/an7581.config not found"
            exit 1
          fi
          cp configs/an7581.config .config
          echo "Loaded configs/an7581.config"

      - name: Select XG2010G only
        shell: bash
        run: |
          set -e
          sed -i -E '/^(# )?CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i -E '/^(# )?CONFIG_TARGET_PER_DEVICE_ROOTFS/d' .config
          sed -i -E '/^(# )?CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          sed -i -E '/^(# )?CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i -E '/^CONFIG_TARGET_DEVICE_PACKAGES_airoha_an7581_DEVICE_/d' .config
          sed -i '/^CONFIG_TARGET_PROFILE=/d' .config
          echo '# CONFIG_TARGET_MULTI_PROFILE is not set' >> .config
          echo 'CONFIG_TARGET_airoha=y' >> .config
          echo 'CONFIG_TARGET_airoha_an7581=y' >> .config
          echo 'CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xg2010g=y' >> .config
          echo 'CONFIG_TARGET_PROFILE="DEVICE_gemtek_xg2010g"' >> .config
          echo "========== Selected target =========="
          grep -E '^CONFIG_TARGET_(airoha|PROFILE)' .config | tail -30 || true

      - name: Configure packages
        shell: bash
        run: |
          set -e

          set_config_y() {
            local symbol="$1"
            sed -i \
              -e "/^${symbol}=.*/d" \
              -e "/^# ${symbol} is not set$/d" \
              .config
            echo "${symbol}=y" >> .config
          }

          set_config_n() {
            local symbol="$1"
            sed -i \
              -e "/^${symbol}=.*/d" \
              -e "/^# ${symbol} is not set$/d" \
              .config
            echo "# ${symbol} is not set" >> .config
          }

          echo "=============================================="
          echo " LuCI / Chinese"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_luci
          set_config_y CONFIG_LUCI_LANG_zh_Hans

          echo "=============================================="
          echo " XG2010G PON"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_luci-app-pon
          set_config_y CONFIG_PACKAGE_airoha-ponctl
          set_config_y CONFIG_PACKAGE_airoha-pond

          echo "=============================================="
          echo " PassWall - heavy-use profile"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_luci-app-passwall
          set_config_y CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy
          set_config_y CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray
          set_config_y CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox
          set_config_y CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview
          set_config_y CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geoview
          set_config_y CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin
          set_config_y CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client
          set_config_y CONFIG_PACKAGE_luci-i18n-passwall-zh-cn

          echo "=============================================="
          echo " Lucky"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_lucky
          set_config_y CONFIG_PACKAGE_luci-app-lucky
          set_config_y CONFIG_PACKAGE_luci-i18n-lucky-zh-cn

          echo "=============================================="
          echo " AdGuard Home"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_adguardhome
          set_config_y CONFIG_PACKAGE_luci-app-adguardhome
          set_config_y CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn

          echo "=============================================="
          echo " MWAN3 - package only, no preset policy"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_mwan3
          set_config_y CONFIG_PACKAGE_luci-app-mwan3
          set_config_y CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn

          echo "=============================================="
          echo " Samba4"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_samba4-server
          set_config_y CONFIG_PACKAGE_luci-app-samba4
          set_config_y CONFIG_PACKAGE_luci-i18n-samba4-zh-cn

          echo "=============================================="
          echo " WireGuard"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_wireguard-tools
          set_config_y CONFIG_PACKAGE_luci-proto-wireguard

          echo "=============================================="
          echo " Useful services"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_luci-app-upnp
          set_config_y CONFIG_PACKAGE_luci-i18n-upnp-zh-cn
          set_config_y CONFIG_PACKAGE_ttyd
          set_config_y CONFIG_PACKAGE_luci-app-ttyd
          set_config_y CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn
          set_config_y CONFIG_PACKAGE_etherwake
          set_config_y CONFIG_PACKAGE_luci-app-wol
          set_config_y CONFIG_PACKAGE_luci-i18n-wol-zh-cn
          set_config_y CONFIG_PACKAGE_nlbwmon
          set_config_y CONFIG_PACKAGE_luci-app-nlbwmon
          set_config_y CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn
          set_config_y CONFIG_PACKAGE_watchcat
          set_config_y CONFIG_PACKAGE_luci-app-watchcat
          set_config_y CONFIG_PACKAGE_luci-i18n-watchcat-zh-cn

          echo "=============================================="
          echo " Network diagnostics"
          echo "=============================================="
          set_config_y CONFIG_PACKAGE_ip-full
          set_config_y CONFIG_PACKAGE_ethtool-full
          set_config_y CONFIG_PACKAGE_tcpdump
          set_config_y CONFIG_PACKAGE_iperf3
          set_config_y CONFIG_PACKAGE_curl
          set_config_y CONFIG_PACKAGE_bind-dig
          set_config_y CONFIG_PACKAGE_mtr-nojson
          set_config_y CONFIG_PACKAGE_ca-bundle
          set_config_y CONFIG_PACKAGE_ca-certificates

          echo "=============================================="
          echo " Explicitly remove duplicated/unneeded packages"
          echo "=============================================="
          set_config_n CONFIG_PACKAGE_ddns-go
          set_config_n CONFIG_PACKAGE_luci-app-ddns-go
          set_config_n CONFIG_PACKAGE_luci-i18n-ddns-go-zh-cn
          set_config_n CONFIG_PACKAGE_sqm-scripts
          set_config_n CONFIG_PACKAGE_luci-app-sqm
          set_config_n CONFIG_PACKAGE_luci-i18n-sqm-zh-cn
          set_config_n CONFIG_PACKAGE_natmap
          set_config_n CONFIG_PACKAGE_luci-app-natmap
          set_config_n CONFIG_PACKAGE_luci-i18n-natmap-zh-cn
          set_config_n CONFIG_PACKAGE_acme
          set_config_n CONFIG_PACKAGE_luci-app-acme
          set_config_n CONFIG_PACKAGE_luci-i18n-acme-zh-cn
          set_config_n CONFIG_PACKAGE_luci-app-diskman
          set_config_n CONFIG_PACKAGE_mosdns
          set_config_n CONFIG_PACKAGE_luci-app-mosdns
          set_config_n CONFIG_PACKAGE_luci-app-openclash
          set_config_n CONFIG_PACKAGE_luci-app-passwall2
          set_config_n CONFIG_PACKAGE_pbr
          set_config_n CONFIG_PACKAGE_luci-app-pbr

          echo ""
          echo "=============================================="
          echo " Running make defconfig"
          echo "=============================================="
          make defconfig

      - name: Verify XG2010G target
        shell: bash
        run: |
          set -e
          if ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xg2010g=y$' .config; then
            echo "::error::XG2010G target is NOT selected"
            exit 1
          fi
          if grep -q '^CONFIG_TARGET_MULTI_PROFILE=y$' .config; then
            echo "::error::MULTI_PROFILE is still enabled"
            exit 1
          fi
          echo "XG2010G target OK"

      - name: Verify package selection
        shell: bash
        run: |
          set -e

          REQUIRED_PACKAGES=(
            "CONFIG_PACKAGE_luci-app-passwall"
            "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray"
            "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox"
            "CONFIG_PACKAGE_lucky"
            "CONFIG_PACKAGE_luci-app-lucky"
            "CONFIG_PACKAGE_adguardhome"
            "CONFIG_PACKAGE_luci-app-adguardhome"
            "CONFIG_PACKAGE_mwan3"
            "CONFIG_PACKAGE_luci-app-mwan3"
            "CONFIG_PACKAGE_samba4-server"
            "CONFIG_PACKAGE_luci-app-samba4"
            "CONFIG_PACKAGE_wireguard-tools"
            "CONFIG_PACKAGE_luci-proto-wireguard"
            "CONFIG_PACKAGE_luci-app-ttyd"
            "CONFIG_PACKAGE_luci-app-nlbwmon"
            "CONFIG_PACKAGE_luci-app-watchcat"
            "CONFIG_PACKAGE_ip-full"
            "CONFIG_PACKAGE_ethtool-full"
            "CONFIG_PACKAGE_tcpdump"
            "CONFIG_PACKAGE_iperf3"
            "CONFIG_PACKAGE_bind-dig"
            "CONFIG_PACKAGE_mtr-nojson"
          )

          FORBIDDEN_PACKAGES=(
            "CONFIG_PACKAGE_ddns-go"
            "CONFIG_PACKAGE_luci-app-ddns-go"
            "CONFIG_PACKAGE_luci-app-sqm"
            "CONFIG_PACKAGE_natmap"
            "CONFIG_PACKAGE_luci-app-natmap"
            "CONFIG_PACKAGE_acme"
            "CONFIG_PACKAGE_luci-app-acme"
            "CONFIG_PACKAGE_luci-app-diskman"
            "CONFIG_PACKAGE_mosdns"
            "CONFIG_PACKAGE_luci-app-openclash"
            "CONFIG_PACKAGE_luci-app-passwall2"
            "CONFIG_PACKAGE_pbr"
            "CONFIG_PACKAGE_luci-app-pbr"
          )

          ERROR=0

          echo "========== Required packages =========="
          for symbol in "${REQUIRED_PACKAGES[@]}"; do
            if grep -q "^${symbol}=y$" .config; then
              echo "OK      ${symbol}"
            else
              echo "::error::MISSING ${symbol}"
              ERROR=1
            fi
          done

          echo ""
          echo "========== Removed packages =========="
          for symbol in "${FORBIDDEN_PACKAGES[@]}"; do
            if grep -q "^${symbol}=y$" .config; then
              echo "::error::UNEXPECTED ${symbol}=y"
              ERROR=1
            else
              echo "REMOVED ${symbol}"
            fi
          done

          echo ""
          echo "========== PassWall options =========="
          grep '^CONFIG_PACKAGE_luci-app-passwall' .config || true

          echo ""
          echo "========== Main LuCI applications =========="
          grep -E \
            '^CONFIG_PACKAGE_luci-app-(passwall|lucky|adguardhome|mwan3|upnp|ttyd|wol|nlbwmon|samba4|watchcat)=y$' \
            .config || true

          if [ "$ERROR" -ne 0 ]; then
            echo "::error::Package verification failed"
            exit 1
          fi

      - name: Save final config
        shell: bash
        run: |
          set -e
          cp .config xg2010g-final.config

      - name: Download packages
        shell: bash
        run: |
          set -e
          make download -j8
          find dl \
            -type f \
            -size -1024c \
            -print \
            -delete || true

      - name: Check disk space
        run: df -h

      - name: Build firmware
        shell: bash
        run: |
          set +e
          echo "=============================================="
          echo " Build XG2010G"
          echo "=============================================="
          make -j"$(nproc)"
          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "=============================================="
            echo " Parallel build failed - retry with V=s"
            echo "=============================================="
            make -j1 V=s
            RESULT=$?
          fi

          exit "$RESULT"

      - name: Prepare artifacts
        if: success()
        shell: bash
        run: |
          set -e
          TARGET_DIR="bin/targets/airoha/an7581"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "::error::Target directory not found: $TARGET_DIR"
            exit 1
          fi

          cp .config "$TARGET_DIR/xg2010g-final.config"

          echo "========== Build output =========="
          ls -lah "$TARGET_DIR"

          echo ""
          echo "========== XG2010G images =========="
          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -iname '*xg2010g*' \
            -print || true

          echo ""
          echo "========== Firmware manifests =========="
          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( -name '*.manifest' -o -name '*packages*' \) \
            -print || true

          echo ""
          echo "========== SHA256 =========="
          cd "$TARGET_DIR"
          find . \
            -maxdepth 1 \
            -type f \
            ! -name 'SHA256SUMS.custom' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.custom || true
          cat SHA256SUMS.custom || true

      - name: Upload XG2010G firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-XG2010G-${{ github.run_number }}
          path: |
            bin/targets/airoha/an7581/
            xg2010g-final.config
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure config
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XG2010G-failed-${{ github.run_number }}
          path: |
            .config
            xg2010g-final.config
            feeds.conf.default
          if-no-files-found: ignore
          retention-days: 7
